; GalleryViewerExamples.ini
; Example INI snippets for the XNAGalleryImageButton and XNAImageViewer controls.
; These are intended to be pasted into a panel/window theme file or a resource INI.
;
; The client INI loader in XNAWindowBase.ParseExtraControls expects values shaped like:
;   ControlName:ControlType
; So the most compatible pattern is to place the name and type together in the section value.

[MyPanel]
; Simple panel-level declarations:
; ExtraControls=GalleryButton:XNAGalleryImageButton
; ExtraControls=GalleryViewer:XNAImageViewer

; If your loader uses a dedicated ExtraControls section instead, this is the equivalent form:
; [ExtraControls]
; GalleryButton=GalleryButton:XNAGalleryImageButton
; GalleryViewer=GalleryViewer:XNAImageViewer

[GalleryButton]
X=40
Y=40
Width=180
Height=110
Text=Gallery
FontIndex=1
IdleTexture=images\gallery_button.png
HoverTexture=images\gallery_button_hover.png
ImageList=images\gallery\img_01.png,images\gallery\img_02.png,images\gallery\img_03.png,images\gallery\img_04.png
ThumbnailList=images\gallery\thumb_01.png,images\gallery\thumb_02.png,images\gallery\thumb_03.png,images\gallery\thumb_04.png
ViewerName=GalleryViewer
ViewerBorderColor=255,255,255
ViewerBorderThickness=1
LoopViewer=true

[GalleryViewer]
X=0
Y=0
Width=1280
Height=720
Visible=false
Enabled=false
ImageList=images\gallery\img_01.png,images\gallery\img_02.png,images\gallery\img_03.png,images\gallery\img_04.png
ThumbnailList=images\gallery\thumb_01.png,images\gallery\thumb_02.png,images\gallery\thumb_03.png,images\gallery\thumb_04.png
LoopImages=true
ThumbWidth=96
ThumbHeight=96
ThumbPadding=6
BorderColor=255,255,255
BorderThickness=1
SelectedImageIndex=0

; Minimal single-image variant:
[GalleryButton_Single]
X=50
Y=50
Width=160
Height=96
Text=Gallery
FontIndex=1
IdleTexture=images\gallery_button.png
HoverTexture=images\gallery_button_hover.png
Image=images\gallery\img_01.png
Thumbnail=images\gallery\thumb_01.png
ViewerName=GalleryViewer
LoopViewer=true

; If you want the viewer to be created as a sibling control with a different image list, you can reuse the same section shape:
; [GalleryViewer]
; X=150
; Y=60
; Width=1000
; Height=660
; ImageList=images\gallery\img_01.png,images\gallery\img_02.png,images\gallery\img_03.png
; ThumbnailList=images\gallery\thumb_01.png,images\gallery\thumb_02.png,images\gallery\thumb_03.png
; LoopImages=true
; ThumbWidth=84
; ThumbHeight=84
; ThumbPadding=4
; BorderColor=255,255,255
; BorderThickness=1
